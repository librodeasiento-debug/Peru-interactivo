/* Mapa general a pantalla completa bajo la barra; el SVG conserva su proporción natural. */
html,body{height:100%;min-height:100%;overflow:hidden}body{padding:0}
.barra{height:62px;min-height:62px;flex:none}
.wrap{width:100%;max-width:none;height:calc(100dvh - 62px);min-height:0;margin:0;padding:0;overflow:hidden}
#overview{height:100%;min-height:0;display:block}
#overview.hidden{display:none!important}
#mapPanel{height:100%;min-height:0;margin:0;padding:0;border:0;border-radius:0;box-shadow:none;background:transparent;overflow:hidden}
#overviewMap{width:100%;height:100%;min-height:0;padding:0;margin:0;border-radius:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
#overviewMap svg{display:block;width:100%;height:100%;min-width:0;min-height:0;max-width:100%;max-height:100%;object-fit:contain;preserveAspectRatio:xMidYMid meet}
#legend,.hint,.foot,#loadPrompt{display:none!important}
#detail{height:calc(100dvh - 62px);overflow:auto}
@media(max-width:700px){.barra{height:58px;min-height:58px;flex-direction:row;align-items:center} .wrap{height:calc(100dvh - 58px)} #detail{height:calc(100dvh - 58px)} #overviewMap svg{width:100%;height:100%;min-height:0}}

/* Barra compacta: anterior, contador, siguiente y nueva pregunta a la derecha. */
.history-nav{justify-content:center;gap:clamp(6px,1.2vw,14px);padding:7px 12px calc(7px + env(safe-area-inset-bottom))}
.history-nav #historyPrev,.history-nav #historyNext{width:42px;height:38px;min-width:42px;padding:4px;font-size:20px;line-height:1;border-radius:11px}
.history-nav .compact-history-status{font-size:14px;min-width:auto;white-space:nowrap;padding:0 3px}

function peopleNames(d){return uniq(d.people.map(line=>{line=String(line).replace(/^•\s*/,'').trim();if(!line.includes(':'))return '';return line.split(':',1)[0].trim()}).filter(x=>x&&!/^(Época|Literatura|Política|Ciencia|Héroes|Deportes|Artes|Personajes|Actualidad|Educación)/i.test(x)))}
function buildQuestions(d){const dep=d.title;const qs=[];const specs=[
 ['Capital',`¿Cuál es la capital de ${dep}?`],

 ['Número de provincias',`¿Cuántas provincias tiene ${dep}, según el documento?`]
 ];const known=new Set(specs.map(x=>x[0]));for(const [label,stem] of specs){const answer=fieldValue(d,label);if(!answer)continue;const ownValues=d.fields.filter(x=>x[0]===label).map(x=>x[1]);const choices=makeChoices(answer,valuesForOtherDepartments(label,dep,ownValues));if(choices)qs.push({stem,answer,choices,key:label})}for(const [label,answer] of d.fields){if(known.has(label)||!answer)continue;const ownValues=d.fields.filter(x=>x[0]===label).map(x=>x[1]);const choices=makeChoices(answer,valuesForOtherDepartments(label,dep,ownValues));if(choices)qs.push({stem:`¿Qué dato se indica sobre ${label} para ${dep}?`,answer,choices,key:'extra:'+label+':'+answer})}
 const ownProvinces=uniq(d.provinces.map(provinceName).filter(Boolean));const otherProvinces=provinceValuesOther(dep,ownProvinces);
 if(ownProvinces.length){for(const answer of ownProvinces){const choices=makeChoices(answer,otherProvinces);if(choices)qs.push({stem:`¿Cuál de estas provincias pertenece a ${dep}?`,answer,choices,key:'provincia:'+answer})}}

function quizTone(freq,duration=0.16,type='sine',volume=0.075,delay=0){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;window.__peruAudio=window.__peruAudio||new AC();const ac=window.__peruAudio;if(ac.state==='suspended')ac.resume();const osc=ac.createOscillator(),gain=ac.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,ac.currentTime+delay);gain.gain.setValueAtTime(.0001,ac.currentTime+delay);gain.gain.exponentialRampToValueAtTime(volume,ac.currentTime+delay+.012);gain.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+delay+duration);osc.connect(gain);gain.connect(ac.destination);osc.start(ac.currentTime+delay);osc.stop(ac.currentTime+delay+duration+.02)}catch(e){}}

function answerCurrentQuestion(choice){if(!currentQuestion||currentQuestion.answered)return;const correctFlag=choice===currentQuestion.answer;currentQuestion.answered=true;if(correctFlag)answerCelebration();else answerSadness();const rec={dept:currentQuestion.dept,stem:currentQuestion.stem,answer:currentQuestion.answer,choices:currentQuestion.choices,chosen:choice,correctFlag,generatedNo:currentQuestion.generatedNo,answeredAt:new Date().toISOString()};historyRecords.push(rec);currentHistoryIndex=historyRecords.length-1;saveQuizState();showQuestion(currentQuestion,rec);updateScoreboard()}

    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){const S1=rotr(e,6)^rotr(e,11)^rotr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])>>>0,S0=rotr(a,2)^rotr(a,13)^rotr(a,22),maj=(a&b)^(a&c)^(b&c),t2=(S0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;}
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
async function hashPassword(text){if(typeof crypto!=='undefined'&&crypto.subtle){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){}}return sha256Fallback(text);}
const ACCESS_RECORDS=JSON.parse(document.getElementById('accountsData').textContent);const ACCESS_MAP=new Map(ACCESS_RECORDS.map(r=>[r.usuario,r.hash]));
const loginGate=document.getElementById('loginGate'),loginForm=document.getElementById('loginForm'),loginUser=document.getElementById('loginUser'),loginPass=document.getElementById('loginPass'),loginError=document.getElementById('loginError'),loginSubmit=document.getElementById('loginSubmit'),signedUser=document.getElementById('signedUser'),mapLogout=document.getElementById('mapLogout');
function enterMapApp(user){loginGate.hidden=true;signedUser.hidden=false;mapLogout.hidden=false;signedUser.textContent='👤 '+user;sessionStorage.setItem('peru_mapa_user',user);sessionStorage.setItem('peru_mapa_session','si')}
loginUser.addEventListener('input',e=>{const p=e.target.selectionStart;e.target.value=e.target.value.toUpperCase();try{e.target.setSelectionRange(p,p)}catch(_){}});
document.getElementById('loginEye').addEventListener('click',()=>{const show=loginPass.type==='password';loginPass.type=show?'text':'password';document.getElementById('loginEye').textContent=show?'🙈':'👁️';document.getElementById('loginEye').setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña')});
loginForm.addEventListener('submit',async e=>{e.preventDefault();loginError.style.display='none';loginSubmit.disabled=true;try{const user=loginUser.value.trim().toUpperCase(),expected=ACCESS_MAP.get(user),entered=await hashPassword(loginPass.value);if(!expected||entered!==expected){loginError.style.display='block';loginPass.value='';loginPass.focus();return}loginPass.value='';enterMapApp(user)}catch(err){loginError.textContent='No se pudo validar el acceso. Vuelve a intentarlo.';loginError.style.display='block'}finally{loginSubmit.disabled=false}});
mapLogout.addEventListener('click',()=>{sessionStorage.removeItem('peru_mapa_user');sessionStorage.removeItem('peru_mapa_session');location.reload()});
const savedMapUser=sessionStorage.getItem('peru_mapa_user');if(sessionStorage.getItem('peru_mapa_session')==='si'&&ACCESS_MAP.has(savedMapUser))enterMapApp(savedMapUser);
</script>
